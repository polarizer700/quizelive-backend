syntax = "proto3";

package quizelive.game.v1;

option go_package = "github.com/polarizer700/quizelive-backend/gen/game/v1;gamev1";

// Черновик кадра WebSocket между TV, телефоном и game-server.
// Хаб и стейт-машина появляются на этапе 3.
// Правильные ответы есть только в QuestionRevealed.

message ClientEnvelope {
  oneof payload {
    CreateRoom create_room = 1;
    JoinRoom join_room = 2;
    StartGame start_game = 3;
    SubmitAnswer submit_answer = 4;
    NextStep next_step = 5;
  }
}

message ServerEnvelope {
  oneof payload {
    RoomState room_state = 1;
    PlayerJoined player_joined = 2;
    QuestionStarted question_started = 3;
    AnswerAccepted answer_accepted = 4;
    QuestionRevealed question_revealed = 5;
    Leaderboard leaderboard = 6;
    GameFinished game_finished = 7;
    GameError error = 8;
  }
}

message CreateRoom {
  string host_token = 1;
}

message JoinRoom {
  string code = 1;
  string nickname = 2;
  string player_token = 3;
}

message StartGame {}

message SubmitAnswer {
  string question_id = 1;
  repeated string option_ids = 2;
  string text = 3;
}

message NextStep {}

message Player {
  string id = 1;
  string nickname = 2;
  int32 score = 3;
  bool connected = 4;
}

message RoomState {
  string code = 1;
  string phase = 2;
  repeated Player players = 3;
}

message PlayerJoined {
  Player player = 1;
}

message QuestionOption {
  string id = 1;
  string text = 2;
}

message QuestionStarted {
  string question_id = 1;
  int32 index = 2;
  int32 total = 3;
  string text = 4;
  string type = 5;
  int32 time_limit_sec = 6;
  repeated QuestionOption options = 7;
  int64 deadline_unix_ms = 8;
}

message AnswerAccepted {
  string question_id = 1;
}

message QuestionRevealed {
  string question_id = 1;
  repeated string correct_option_ids = 2;
  repeated string correct_texts = 3;
}

message LeaderboardEntry {
  string nickname = 1;
  int32 score = 2;
  int32 rank = 3;
}

message Leaderboard {
  repeated LeaderboardEntry entries = 1;
}

message GameFinished {
  repeated LeaderboardEntry entries = 1;
}

message GameError {
  string code = 1;
  string message = 2;
}
