version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/infrastructure/repository/query"
    schema: ".sqlc/schema.sql"
    gen:
      go:
        package: "sqlcdb"
        out: "internal/infrastructure/repository/sqlcdb"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
